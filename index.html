<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App voor Roger</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="cursor">
        <img src="./media/cursor.jpeg">
    </div>


    <div class="left">
        
        <div class="left-panel">
            
            <div class="document-part">

                <details class="document-panel">
                    <summary tabindex="0" aria-label="documenten">Documenten</summary>
                    <div class="document-text">
                        <button class="button" data-doc="Plato" aria-label="open document plato">
                            Plato
                        </button>
                    
                        <button class="button" data-doc="Epistemologie" aria-label="open document epistemologie">
                            Epistemologie
                        </button>

                        <div id="text-container"></div>
                    </div>
                </details>
            </div>
        </div>

            <div class="right-panel" id="note-panel">
                <details class="notes-panel">
                    <summary tabindex="0" aria-label="notities">N</summary>
                    <div id="saved-notes"></div>

                    <textarea id="note-input" aria-label="voer hier je notitie in Klik op tab om daarna naar de opslaan knop te gaan."></textarea>

                    <button id="save-note" aria-label="notitie opslaan">
                    Opslaan
                    </button>

                    <div class="saved" id="saved-message" aria-live="assertive"></div>
                </details>
        </div>
    </div>


    <script src="script.js"></script>

</body>
</html>
