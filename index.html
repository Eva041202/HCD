<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App voor Roger</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="left">
        
        <div class="left-panel">
            
            <div class="document-part">

                <details class="document-panel">
                    <summary tabindex="0">Documenten</summary>
                    <div class="document-text">
                        <button class="button" data-doc="Plato">
                            Plato
                        </button>
                    
                        <button class="button" data-doc="Epistemologie">
                            Epistemologie
                        </button>

                        <div id="text-conatiner"></div>
                    </div>
                </details>

                <details class="notes-panel">
                    <summary tabindex="0">N</summary>
                    <div id="saved-notes">
                        "Geen notities opgeslagen"
                    </div>
                </details>
            </div>

            <div class="right-panel hidden" id="note-panel">
                <h1>Notitie</h1>

                <textarea id="note-input"></textarea>

                <button id="save-note">
                Opslaan
                </button>
            </div>
        </div>


    <script src="script.js"></script>

</body>
</html>
